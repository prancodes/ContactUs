<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="contact-card">
    <h2>Contact Us</h2>
    <form action="/contact" method="post">
      <div class="form-group">
        <label for="contact-name">Full Name</label>
        <input type="text" id="contact-name" name="name" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="contact-email">Email Address</label>
        <input type="email" id="contact-email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="contact-subject">Subject</label>
        <select id="contact-subject" name="subject" required>
          <option value="" disabled selected>Choose a subject</option>
          <option value="general">General Inquiry</option>
          <option value="support">Support Request</option>
          <option value="feedback">Feedback</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" placeholder="Type your message here..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message</button>
    </form>
  </div>

</body>
</html>
